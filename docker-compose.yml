services:
  # ---------------------------------------------------------------------------
  # Single OSS API — Bun + Hono + Drizzle (auth, websites, analytics, funnels,
  # automations, tracker, session replay, heatmaps). Run `bun run db:push` in
  # ./core once against an empty Postgres (or migrate from a legacy schema).
  # Optional: ./data/maxmind/GeoLite2-City.mmdb for analytics country/region/city (see seentics/README).
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./core
      dockerfile: Dockerfile.dev
    container_name: seentics-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://seentics:seentics_pass@seentics-postgres:5432/seentics_analytics?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key--must-be-32-characters}
      - GLOBAL_API_KEY=${GLOBAL_API_KEY:-dev-global-api-key}
      - S3_ENDPOINT=http://minio:9000
      # Presigned replay/heatmap URLs must use a host the browser can open (not Docker-only `minio`).
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_BUCKET_REPLAYS=seentics-replays
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - MAXMIND_DB_PATH=${MAXMIND_DB_PATH:-/app/db/maxmind/GeoLite2-City.mmdb}
      - MAXMIND_GEO_CACHE_MAX=${MAXMIND_GEO_CACHE_MAX:-50000}
      # Optional ISO2 when ingest only sees private IPs (localhost/Docker). Example: BD. Leave unset for no fallback.
      - GEO_FALLBACK_COUNTRY=${GEO_FALLBACK_COUNTRY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./core:/app
      - /app/node_modules
    networks:
      - seentics-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "-O-", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:15-alpine
    container_name: seentics-postgres
    environment:
      - POSTGRES_USER=seentics
      - POSTGRES_PASSWORD=seentics_pass
      - POSTGRES_DB=seentics_analytics
    volumes:
      - seentics-db-v3:/var/lib/postgresql/data
    networks:
      - seentics-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U seentics -d seentics_analytics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: seentics-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    command: server /data --console-address ":9001"
    volumes:
      - seentics-minio-v3:/data
    networks:
      - seentics-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 3

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb --ignore-existing myminio/seentics-replays; /usr/bin/mc anonymous set public myminio/seentics-replays; exit 0; "
    networks:
      - seentics-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: seentics-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - API_GATEWAY_URL=http://api:8080
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      api:
        condition: service_healthy
    networks:
      - seentics-network
    restart: unless-stopped

volumes:
  seentics-db-v3:
  seentics-minio-v3:

networks:
  seentics-network:
    name: seentics-network
    driver: bridge
